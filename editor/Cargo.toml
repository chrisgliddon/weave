[package]
name = "weave_editor"
description = "Standalone GPUI editor for Weave projects"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
gpui.workspace = true
gpui-flow.workspace = true
notify.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
thiserror.workspace = true
unicode-segmentation.workspace = true
weave-compiler = { path = "../crates/weave-compiler" }
weave-core = { path = "../crates/weave-core" }
weave-domain = { path = "../crates/weave-domain" }
weave-fmt = { path = "../crates/weave-fmt" }
weave-patterns = { path = "../crates/weave-patterns" }
weave-runtime = { path = "../crates/weave-runtime" }
weave-world = { path = "../crates/weave-world" }

[target.'cfg(target_os = "macos")'.dependencies]
gpui_platform = { workspace = true, features = ["font-kit", "runtime_shaders"] }

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
gpui_platform = { workspace = true, features = ["wayland", "x11"] }

[target.'cfg(target_os = "windows")'.dependencies]
gpui_platform.workspace = true

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true
