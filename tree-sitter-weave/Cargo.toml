[package]
name = "tree-sitter-weave"
description = "Tree-sitter grammar for the Weave narrative scripting language"
version = "0.1.0"
authors = ["Weave Contributors"]
license = "MIT"
readme = "README.md"
keywords = ["incremental", "parsing", "tree-sitter", "weave"]
categories = ["parser-implementations", "parsing", "text-editors"]
repository = "https://github.com/chrisgliddon/weave"
edition = "2021"
autoexamples = false

build = "bindings/rust/build.rs"
include = [
  "bindings/rust/*",
  "grammar.js",
  "queries/*",
  "src/*",
  "tree-sitter.json",
  "/LICENSE",
]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tree-sitter = "0.26.12"
