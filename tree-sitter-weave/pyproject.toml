[build-system]
requires = ["setuptools>=62.4.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tree-sitter-weave"
description = "Tree-sitter grammar for the Weave narrative scripting language"
version = "0.1.0"
keywords = ["incremental", "parsing", "tree-sitter", "weave"]
classifiers = [
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Compilers",
  "Topic :: Text Processing :: Linguistic",
  "Typing :: Typed",
]
authors = [{ name = "Weave Contributors" }]
requires-python = ">=3.10"
license.text = "MIT"
readme = "README.md"

[project.urls]
Homepage = "https://github.com/chrisgliddon/weave"
Source = "https://github.com/chrisgliddon/weave/tree/main/tree-sitter-weave"

[project.optional-dependencies]
core = ["tree-sitter~=0.24"]

[tool.cibuildwheel]
build = "cp310-*"
build-frontend = "build"
