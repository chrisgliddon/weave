[workspace]
members = [
    "crates/weave-bevy",
    "crates/weave-compiler",
    "crates/weave-core",
    "crates/weave-fmt",
    "crates/weave-patterns",
    "crates/weave-runtime",
    "editor",
    "examples/bevy-dialogue",
    "examples/standalone-runtime",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "MIT"
repository = "https://github.com/chrisgliddon/weave"

[workspace.dependencies]
bevy = { version = "0.18.1", default-features = false, features = [
    "bevy_asset",
    "file_watcher",
    "multi_threaded",
    "serialize",
    "std",
] }
clap = { version = "4.6.6", features = ["derive"] }
gpui = { git = "https://github.com/zed-industries/zed" }
gpui-flow = { git = "https://github.com/pacifio/gpui-flow", rev = "cfa578758ee251657f15f281d893a08b85aedbff" }
gpui_platform = { git = "https://github.com/zed-industries/zed", default-features = false }
notify = "8.2.0"
pest = "2.9.0"
pest_derive = "2.9.0"
proptest = "1.11.0"
rand = "0.9.2"
rand_chacha = { version = "0.9.0", features = ["serde"] }
ron = "0.12.2"
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.145"
tempfile = "3.27.0"
thiserror = "2.0.20"
unicode-segmentation = "1.13.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
