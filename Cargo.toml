[workspace]
members = [
    "crates/weave-bevy",
    "crates/weave-compiler",
    "crates/weave-core",
    "crates/weave-domain",
    "crates/weave-fmt",
    "crates/weave-patterns",
    "crates/weave-runtime",
    "crates/weave-web",
    "crates/weave-lsp",
    "editor",
    "examples/bevy-dialogue",
    "examples/domain-module-bevy",
    "examples/standalone-runtime",
    "tree-sitter-weave",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "MIT"
repository = "https://github.com/chrisgliddon/weave"

[workspace.dependencies]
bevy = { version = "0.18.1", default-features = false, features = [
    "bevy_asset",
    "file_watcher",
    "multi_threaded",
    "serialize",
    "std",
] }
clap = { version = "4.6.6", features = ["derive"] }
gpui = { git = "https://github.com/zed-industries/zed" }
gpui-flow = { git = "https://github.com/pacifio/gpui-flow", rev = "cfa578758ee251657f15f281d893a08b85aedbff" }
gpui_platform = { git = "https://github.com/zed-industries/zed", default-features = false }
notify = "8.2.0"
pest = "2.9.0"
pest_derive = "2.9.0"
proptest = "1.11.0"
rand = { version = "0.9.2", default-features = false, features = ["std"] }
rand_chacha = { version = "0.9.0", features = ["serde"] }
ron = "0.12.2"
schemars = "1.2.2"
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.145"
serde-wasm-bindgen = "0.6.5"
sha2 = "0.10.9"
tempfile = "3.27.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["io-std", "io-util", "macros", "rt-multi-thread", "sync"] }
tower-lsp-server = "0.23.0"
unicode-segmentation = "1.13.1"
url = "2.5.8"
wasm-bindgen = "0.2.127"
walkdir = "2.5.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
