<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111326" />
    <title>Weave domain module · PixiJS</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main>
      <h1>Portable domain export</h1>
      <p id="status" role="status">Loading the compiled Weave JSON…</p>
      <div
        id="canvas"
        aria-label="Weave World, Character, and synthetic constellation visualization"
      ></div>
      <h2>Tabletop adapter fixture replay</h2>
      <p>
        Every checked-in adapter loads its JSON replay record. Events shown here are the public
        subset; host-only payloads stay out of the runtime bundle.
      </p>
      <div
        id="tabletop-canvas"
        aria-label="Tabletop adapter events, final state hashes, and observable values"
      ></div>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
